<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Reach - Wyndham Letterbox Distribution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 480px; /* 모바일 최적화 폭 */
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
            background-color: #ffffff;
        }
        /* 로고 크기를 넉넉하게 키웠습니다 (기존 180px -> 300px) */
        header img.logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .hero-section {
            width: 100%;
        }
        .hero-section img {
            width: 100%;
            height: auto;
            display: block;
        }
        .hero-text {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #fdfdfd);
            border-bottom: 1px solid #eaeaea;
        }
        .hero-text h2 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .products-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .product-card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .product-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            font-size: 18px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .product-info .desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .cta-button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .cta-button:hover {
            background-color: #333333;
        }
        /* 견적 문의 폼 섹션 스타일 */
        .quote-section {
            padding: 30px 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #eaeaea;
        }
        .quote-section h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .quote-section > p {
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .name-row {
            display: flex;
            gap: 12px;
        }
        .name-field {
            flex: 1;
        }
        .name-field span {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 4px;
        }
        .quote-section input[type="text"],
        .quote-section input[type="email"],
        .quote-section textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        .quote-section input:focus,
        .quote-section textarea:focus {
            border-color: #7b73ef;
        }
        .quote-section textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background-color: #7b73ef;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #685edf;
        }
        footer {
            margin-top: auto;
            padding: 30px 20px;
            text-align: center;
            background-color: #f1f3f5;
            color: #666;
            font-size: 12px;
        }
        footer p {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 (로고 크기 확대) -->
        <header>
            <img src="Local Reach_Logo.jpg" alt="Local Reach Logo" class="logo">
        </header>

        <!-- 메인 이미지 및 소개 섹션 -->
        <div class="hero-section">
            <img src="main.jpg" alt="Local Marketing & Growth Solutions">
            <div class="hero-text">
                <h2>Grow Your Business Locally</h2>
            </div>
        </div>

        <!-- 상품 목록 섹션 (서브 이미지 2개) -->
        <div class="products-container">
            
            <!-- 상품 1 (1000부) -->
            <div class="product-card">
                <img src="sub1.jpg" alt="Wyndham 1000 Copies Distribution">
